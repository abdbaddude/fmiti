# Package-level config (used when Netlify base directory = this folder).
# Prefer the repo-root netlify.toml when the whole `fmiti` repo is linked.

[build]
  publish = "."
  command = "echo 'Static site – no build required'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/projects.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
