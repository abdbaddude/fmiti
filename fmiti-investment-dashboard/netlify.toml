[build]
  publish = "."
  command = "echo 'Static site – no build required'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/projects.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
