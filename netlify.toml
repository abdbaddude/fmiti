# FMITI – Netlify site config
# Production branch: main
# Preview branches: deploy/netlify and others

[build]
  # App lives in this subdirectory of the repo
  base = "fmiti-investment-dashboard"
  # Publish directory is relative to `base`
  publish = "."
  # Static SPA – no compile step
  command = "echo 'Static site – no build required'"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/projects.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
