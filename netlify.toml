# FMITI – Netlify site config
# Production branch: main
# Preview branches: deploy/netlify and others

[build]
  # App lives in this subdirectory of the repo
  base = "fmiti-investment-dashboard"
  # Publish directory is relative to `base`
  publish = "."
  # Static SPA – no compile step
  command = "echo 'Static site – no build required'"

[build.environment]
  NODE_VERSION = "20"

# SPA-style fallback (optional; dashboard is index.html at root of publish dir)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
# Disabled catch-all by default – static files must resolve directly.
# Uncomment a simple 200 rewrite only if you add client-side routes later:
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/projects.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
